# Environment used to train and evaluate the released model (Ubuntu 20.04, CUDA 12.4).
name: scflora
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - numpy==1.26.4
      - scipy==1.12.0
      - h5py==3.14.0
      - anndata==0.11.4
      - scanpy==1.11.4
      - pandas==2.2.0
      - transformers==4.55.4
      - pytest
