[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scflora"
version = "1.0.0"
description = "scFLORA: a generative virtual cell model for plant single-cell transcriptomes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "h5py>=3.8",
  "anndata>=0.10",
  "scanpy>=1.9",
  "pandas>=1.5",
]

[project.optional-dependencies]
protein = ["transformers>=4.40"]
test = ["pytest>=7"]

[project.scripts]
scflora = "scflora.cli:main"

[tool.setuptools.packages.find]
include = ["scflora*"]
